<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagram Redesign</title>
<style>
	:root {
		--bg: #EEF2FA;
		--surface: #FFFFFF;
		--surface-2: #F4F7FD;
		--text: #17203A;
		--text-dim: #5C6785;
		--text-faint: #94A0BE;
		--border: #DCE3F2;
		--accent: #3459E0;
		--accent-2: #14A6B8;
		--glow: rgba(52, 89, 224, 0.30);
		--added: #1E9E5A;
		--added-bg: rgba(30, 158, 90, 0.10);
		--deleted: #D6455B;
		--deleted-bg: rgba(214, 69, 91, 0.10);
		--modified: #C98A1B;
		--modified-bg: rgba(201, 138, 27, 0.12);
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #0A0E19;
			--surface: #131A2E;
			--surface-2: #171F38;
			--text: #E8ECFB;
			--text-dim: #939CBE;
			--text-faint: #5B6488;
			--border: #262E4E;
			--accent: #6D93F5;
			--accent-2: #4FDCEA;
			--glow: rgba(109, 147, 245, 0.38);
			--added: #4ADE94;
			--added-bg: rgba(74, 222, 148, 0.10);
			--deleted: #F0728A;
			--deleted-bg: rgba(240, 114, 138, 0.12);
			--modified: #F0C05A;
			--modified-bg: rgba(240, 192, 90, 0.12);
		}
	}
	:root[data-theme="dark"] {
		--bg: #0A0E19; --surface: #131A2E; --surface-2: #171F38;
		--text: #E8ECFB; --text-dim: #939CBE; --text-faint: #5B6488; --border: #262E4E;
		--accent: #6D93F5; --accent-2: #4FDCEA; --glow: rgba(109, 147, 245, 0.38);
		--added: #4ADE94; --added-bg: rgba(74, 222, 148, 0.10);
		--deleted: #F0728A; --deleted-bg: rgba(240, 114, 138, 0.12);
		--modified: #F0C05A; --modified-bg: rgba(240, 192, 90, 0.12);
	}

	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; height: 100%; }
	body {
		background: var(--bg);
		color: var(--text);
		font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
		min-height: 100vh;
		overflow: hidden;
		display: flex;
		flex-direction: column;
	}
	.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

	#topbar {
		flex-shrink: 0;
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		gap: 24px;
		padding: 14px 20px;
		border-bottom: 1px solid var(--border);
		background: var(--surface);
		z-index: 20;
	}
	#topbar h1 { margin: 0; font-size: 15px; font-weight: 650; }
	#topbar .badge {
		display: inline-block; margin-left: 10px; padding: 2px 8px;
		font-size: 10.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
		color: var(--accent); border: 1px solid var(--accent); border-radius: 100px; vertical-align: middle;
	}
	#topbar .sub {
		margin: 3px 0 0 0; font-size: 12.5px; color: var(--text-dim);
		font-variant-numeric: tabular-nums;
	}
	#topbar .sub, #topbar .sub * { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

	#viewport {
		position: relative;
		flex: 1;
		min-height: 0;
		overflow: hidden;
		cursor: grab;
		background-image: radial-gradient(color-mix(in srgb, var(--border) 70%, transparent) 1px, transparent 1px);
		background-size: 22px 22px;
	}
	#viewport.panning { cursor: grabbing; }
	#world {
		position: absolute;
		top: 0; left: 0;
		transform-origin: 0 0;
		will-change: transform;
	}
	#world.no-anim { transition: none; }

	#lines { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
	#lines path { transition: opacity 0.25s ease, stroke-width 0.25s ease; }
	#lines path.dimmed { opacity: 0.08; }
	#lines path.hi { opacity: 1 !important; }

	.folder {
		background: var(--surface);
		background: color-mix(in srgb, var(--surface) 88%, transparent);
		border: 1px solid var(--border);
		border-radius: 16px;
		padding: 16px 18px 20px;
		margin: 0 28px 28px;
		backdrop-filter: blur(6px);
	}
	.folder-head {
		display: flex; align-items: center; gap: 9px;
		margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
	}
	.folder-head .path {
		font-size: 12.5px; font-weight: 650; color: var(--text-dim);
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}
	.folder-head .count {
		margin-left: auto; font-size: 10.5px; color: var(--text-faint);
		background: var(--surface-2); border-radius: 100px; padding: 2px 9px;
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}
	.class-grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }

	.class-box {
		width: 216px;
		background: var(--surface);
		border: 1px solid var(--border);
		border-radius: 12px;
		box-shadow: 0 1px 2px rgba(10, 14, 25, 0.04);
		overflow: hidden;
		transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.25s ease;
		position: relative;
	}
	.class-box::before {
		content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
		background: var(--accent-bar, var(--accent));
	}
	.class-box.status-added::before { background: var(--added); }
	.class-box.status-deleted::before { background: var(--deleted); }
	.class-box.status-modified::before { background: var(--modified); }
	.class-box:hover, .class-box.hi {
		transform: translateY(-3px);
		border-color: var(--accent);
		box-shadow: 0 10px 24px var(--glow);
		z-index: 5;
	}
	.class-box.dimmed { opacity: 0.28; }

	.class-box .head { padding: 10px 12px 8px; }
	.class-box .stereo {
		font-size: 9.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase;
		color: var(--accent-2); margin-bottom: 2px;
	}
	.class-box .name {
		font-size: 13px; font-weight: 650;
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}
	.class-box.status-added .name { color: var(--added); }
	.class-box.status-deleted .name { color: var(--deleted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--deleted) 50%, transparent); }
	.class-box.status-modified .name { color: var(--modified); }

	.section { border-top: 1px solid var(--border); padding: 6px 0; }
	.row {
		display: flex; align-items: baseline; gap: 6px;
		padding: 2.5px 12px; font-size: 10.5px;
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		white-space: nowrap; overflow: hidden;
	}
	.row .vis { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
	.vis.public { background: var(--accent-2); }
	.vis.private { background: var(--deleted); opacity: 0.75; }
	.vis.protected { background: var(--modified); opacity: 0.85; }
	.row .rname { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
	.row .rtype { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; }
	.row.more { color: var(--text-faint); font-style: italic; opacity: 0.85; }
	.row.empty { color: var(--text-faint); font-style: italic; }

	#errbox {
		display: none;
		position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
		z-index: 999; max-width: 560px;
		background: var(--deleted-bg); border: 1px solid var(--deleted); color: var(--text);
		border-radius: 10px; padding: 10px 14px; font-size: 12px;
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}
	#errbox strong { color: var(--deleted); }

	#legend {
		position: absolute; left: 18px; bottom: 18px; z-index: 20;
		background: var(--surface);
		background: color-mix(in srgb, var(--surface) 90%, transparent);
		border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
		font-size: 11px; color: var(--text-dim); backdrop-filter: blur(10px); line-height: 1.7;
	}
	#legend strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 11.5px; }
	#legend .row2 { display: flex; align-items: center; gap: 7px; }
	#legend .ln { width: 16px; height: 2px; border-radius: 2px; flex-shrink: 0; }

	#hint {
		position: absolute; right: 18px; bottom: 18px; z-index: 20;
		font-size: 11px; color: var(--text-faint);
		font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	}
	#zoomctl {
		position: absolute; right: 18px; top: 18px; z-index: 20;
		display: flex; flex-direction: column; gap: 4px;
	}
	#zoomctl button {
		width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
		background: var(--surface);
		background: color-mix(in srgb, var(--surface) 90%, transparent);
		color: var(--text);
		font-size: 15px; cursor: pointer; backdrop-filter: blur(10px);
	}
	#zoomctl button:hover { border-color: var(--accent); color: var(--accent); }
</style>

<div id="errbox"><strong>Render error &mdash;</strong> <span id="errmsg"></span></div>
<div id="topbar">
	<div>
		<h1>nextjs-layered-app &mdash; class diagram<span class="badge">Design mockup</span></h1>
		<p class="sub" id="stats">loading real kratai data&hellip;</p>
	</div>
</div>
<div id="viewport">
	<div id="world" class="no-anim">
		<svg id="lines"></svg>
		<div id="folders"></div>
	</div>
	<div id="legend">
		<strong>Relationships</strong>
		<div class="row2"><span class="ln" style="background:var(--accent)"></span> extends / implements</div>
		<div class="row2"><span class="ln" style="background:var(--accent-2)"></span> calls</div>
		<div class="row2"><span class="ln" style="background:var(--text-faint)"></span> uses / imports</div>
	</div>
	<div id="zoomctl">
		<button id="zin">+</button>
		<button id="zout">&minus;</button>
	</div>
	<div id="hint">scroll to zoom &middot; drag to pan &middot; hover a class</div>
</div>

</head>

	var MAX_ROWS = 6;

	var foldersEl = document.getElementById('folders');
	var svg = document.getElementById('lines');
	var world = document.getElementById('world');
	var viewport = document.getElementById('viewport');

	function esc(s) {
		return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	}

	function rowsHtml(items, kind) {
		var shown = items.slice(0, MAX_ROWS);
		var html = shown.map(function (it) {
			if (kind === 'prop') {
				return '<div class="row"><span class="vis ' + it.visibility + '"></span>' +
					'<span class="rname">' + esc(it.name) + '</span><span class="rtype">: ' + esc(it.type || '') + '</span></div>';
			}
			var params = (it.params || []).join(', ');
			return '<div class="row"><span class="vis ' + it.visibility + '"></span>' +
				'<span class="rname">' + esc(it.name) + '</span><span class="rtype">(' + esc(params) + ')</span></div>';
		}).join('');
		if (items.length === 0) {
			html = '<div class="row empty">none</div>';
		} else if (items.length > MAX_ROWS) {
			html += '<div class="row more">+' + (items.length - MAX_ROWS) + ' more</div>';
		}
		return html;
	}

	var totalClasses = 0;
	DATA.folders.forEach(function (f) {
		var folderDiv = document.createElement('div');
		folderDiv.className = 'folder';

		var head = document.createElement('div');
		head.className = 'folder-head';
		head.innerHTML = '<span class="path">' + esc(f.path || '(root)') + '</span>' +
			'<span class="count">' + f.classes.length + '</span>';
		folderDiv.appendChild(head);

		var grid = document.createElement('div');
		grid.className = 'class-grid';

		f.classes.forEach(function (c) {
			totalClasses++;
			var box = document.createElement('div');
			var statusClass = c.changeStatus && c.changeStatus !== 'unchanged' ? ' status-' + c.changeStatus : '';
			box.className = 'class-box' + statusClass;
			box.dataset.id = c.id;

			var stereo = c.isInterface ? 'interface' : c.isAbstract ? 'abstract' : '';
			box.innerHTML =
				'<div class="head">' +
					(stereo ? '<div class="stereo">&laquo;' + stereo + '&raquo;</div>' : '') +
					'<div class="name">' + esc(c.name) + '</div>' +
				'</div>' +
				'<div class="section">' + rowsHtml(c.properties, 'prop') + '</div>' +
				'<div class="section">' + rowsHtml(c.methods, 'method') + '</div>';

			grid.appendChild(box);
		});

		folderDiv.appendChild(grid);
		foldersEl.appendChild(folderDiv);
	});

	document.getElementById('stats').textContent =
		DATA.folders.length + ' folders · ' + totalClasses + ' classes · ' + DATA.relationships.length + ' relationships';

	var TYPE_COLOR = { extends: 'var(--accent)', implements: 'var(--accent)' };
	var TYPE_DASH = { implements: '5,4', uses: '3,4', imports: '3,4' };
	function colorFor(type) { return TYPE_COLOR[type] || (isCallLike(type) ? 'var(--accent-2)' : 'var(--text-faint)'); }
	function isCallLike(type) { return /^(calls|async-calls|creates)/.test(type); }

	function drawLines() {
		var worldRect = world.getBoundingClientRect();
		var scale = getScale();
		var boxes = {};
		document.querySelectorAll('.class-box').forEach(function (el) {
			var r = el.getBoundingClientRect();
			boxes[el.dataset.id] = {
				el: el,
				cx: (r.left - worldRect.left) / scale + r.width / scale / 2,
				cy: (r.top - worldRect.top) / scale + r.height / scale / 2,
				w: r.width / scale, h: r.height / scale
			};
		});

		var maxX = 0, maxY = 0;
		Object.keys(boxes).forEach(function (id) {
			maxX = Math.max(maxX, boxes[id].cx + boxes[id].w);
			maxY = Math.max(maxY, boxes[id].cy + boxes[id].h);
		});
		svg.setAttribute('width', maxX + 40);
		svg.setAttribute('height', maxY + 40);

		svg.innerHTML =
			'<defs>' +
			'<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.8"/></marker>' +
			'</defs>';

		var paths = [];
		DATA.relationships.forEach(function (r, i) {
			var a = boxes[r.source], b = boxes[r.target];
			if (!a || !b || a === b) return;

			var dx = b.cx - a.cx, dy = b.cy - a.cy;
			var dist = Math.hypot(dx, dy) || 1;
			var nx = -dy / dist, ny = dx / dist;
			var bow = Math.min(60, dist * 0.18) * (i % 2 === 0 ? 1 : -1);
			var mx = (a.cx + b.cx) / 2 + nx * bow;
			var my = (a.cy + b.cy) / 2 + ny * bow;

			var d = 'M ' + a.cx + ',' + a.cy + ' Q ' + mx + ',' + my + ' ' + b.cx + ',' + b.cy;
			var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
			path.setAttribute('d', d);
			path.setAttribute('fill', 'none');
			path.setAttribute('stroke', colorFor(r.type));
			path.setAttribute('stroke-width', isCallLike(r.type) ? 1.1 : 1.4);
			path.setAttribute('color', colorFor(r.type));
			if (TYPE_DASH[r.type]) path.setAttribute('stroke-dasharray', TYPE_DASH[r.type]);
			path.setAttribute('marker-end', 'url(#arrow)');
			path.dataset.source = r.source;
			path.dataset.target = r.target;
			svg.appendChild(path);
			paths.push(path);
		});

		// entrance animation: draw each path in, lightly staggered
		requestAnimationFrame(function () {
			paths.forEach(function (p, i) {
				var len = p.getTotalLength();
				p.style.strokeDasharray = (TYPE_DASH[p.dataset.type] ? TYPE_DASH[p.dataset.type] + ',' : '') + len;
				p.style.strokeDashoffset = len;
				p.getBoundingClientRect();
				p.style.transition = 'stroke-dashoffset 0.7s cubic-bezier(.2,.7,.3,1) ' + Math.min(i * 6, 500) + 'ms';
				requestAnimationFrame(function () { p.style.strokeDashoffset = 0; });
			});
		});
	}

	// ---- hover highlight ----
	document.addEventListener('mouseover', function (e) {
		var box = e.target.closest('.class-box');
		if (!box) return;
		var id = box.dataset.id;
		var related = new Set([id]);
		svg.querySelectorAll('path').forEach(function (p) {
			if (p.dataset.source === id || p.dataset.target === id) {
				related.add(p.dataset.source); related.add(p.dataset.target);
			}
		});
		document.querySelectorAll('.class-box').forEach(function (b) {
			b.classList.toggle('hi', related.has(b.dataset.id));
			b.classList.toggle('dimmed', !related.has(b.dataset.id));
		});
		svg.querySelectorAll('path').forEach(function (p) {
			var hit = p.dataset.source === id || p.dataset.target === id;
			p.classList.toggle('hi', hit);
			p.classList.toggle('dimmed', !hit);
		});
	});
	document.addEventListener('mouseout', function (e) {
		if (!e.target.closest('.class-box')) return;
		if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.class-box')) return;
		document.querySelectorAll('.class-box').forEach(function (b) { b.classList.remove('hi', 'dimmed'); });
		svg.querySelectorAll('path').forEach(function (p) { p.classList.remove('hi', 'dimmed'); });
	});

	// ---- zoom / pan ----
	var scale = 0.72, tx = 40, ty = 20;
	function getScale() { return scale; }
	function apply() { world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }

	viewport.addEventListener('wheel', function (e) {
		e.preventDefault();
		var prev = scale;
		scale = Math.max(0.25, Math.min(2, scale - e.deltaY * 0.0012));
		var rect = viewport.getBoundingClientRect();
		var mx = e.clientX - rect.left, my = e.clientY - rect.top;
		tx = mx - (mx - tx) * (scale / prev);
		ty = my - (my - ty) * (scale / prev);
		apply();
	}, { passive: false });

	var dragging = false, lastX = 0, lastY = 0;
	viewport.addEventListener('pointerdown', function (e) {
		if (e.target.closest('.class-box')) return;
		dragging = true; viewport.classList.add('panning'); lastX = e.clientX; lastY = e.clientY;
	});
	window.addEventListener('pointerup', function () { dragging = false; viewport.classList.remove('panning'); });
	window.addEventListener('pointermove', function (e) {
		if (!dragging) return;
		tx += e.clientX - lastX; ty += e.clientY - lastY;
		lastX = e.clientX; lastY = e.clientY;
		apply();
	});
	document.getElementById('zin').addEventListener('click', function () { scale = Math.min(2, scale + 0.15); apply(); });
	document.getElementById('zout').addEventListener('click', function () { scale = Math.max(0.25, scale - 0.15); apply(); });

	apply();
	requestAnimationFrame(function () {
		drawLines();
		requestAnimationFrame(function () { world.classList.remove('no-anim'); });
	});
	window.addEventListener('resize', drawLines);
	}
})();
